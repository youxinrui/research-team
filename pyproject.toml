[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-team"
version = "0.1.0"
description = "A multi-agent research report team built on LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langchain-core",
    "langchain-openai",
    "langgraph-checkpoint-sqlite",
    "ddgs",
    "beautifulsoup4",
    "numpy",
    "rank_bm25",
    "jieba",
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "pydantic",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
